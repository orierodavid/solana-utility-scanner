name: Outcome Evaluator

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outcome-evaluator
  cancel-in-progress: true

jobs:
  evaluate:
    name: Measure matured scanner outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore scanner history
        uses: actions/cache@v4
        with:
          path: data/outcomes.jsonl
          key: scanner-history-evaluator-${{ github.run_id }}
          restore-keys: |
            scanner-history-

      - name: Restore outcome measurements
        uses: actions/cache@v4
        with:
          path: data/outcome_measurements.jsonl
          key: scanner-measurements-${{ github.run_id }}
          restore-keys: |
            scanner-measurements-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Measure matured outcomes
        run: python -c "from src.outcome_evaluator import evaluate_outcomes; r=evaluate_outcomes('data/outcomes.jsonl','data/outcome_measurements.jsonl'); print(f'Measured {len(r)} outcome(s)')"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-measurements-${{ github.run_id }}
          path: |
            data/outcomes.jsonl
            data/outcome_measurements.jsonl
          if-no-files-found: warn
          retention-days: 30
