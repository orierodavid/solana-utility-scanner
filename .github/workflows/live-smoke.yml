name: Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    name: One real scanner cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENABLE_TELEGRAM_ALERTS: "false"
      OUTCOME_STORE_PATH: data/outcomes.jsonl
      HEALTH_STORE_PATH: data/scan_health.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one real live scanner cycle
        run: python -m src.runner --once

      - name: Publish live smoke records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: |
            data/outcomes.jsonl
            data/scan_health.jsonl
          if-no-files-found: warn
          retention-days: 14
